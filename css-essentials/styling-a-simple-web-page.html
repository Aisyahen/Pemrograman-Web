<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Styling a Simple Web Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      background-color: #f4f4f9;
      color: #333;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 {
      color: #2c3e50;
      border-bottom: 2px solid #3498db;
      padding-bottom: 5px;
    }
    p {
      color: #555;
    }
    .highlight {
      background-color: #e74c3c;
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Selamat Datang di Halaman Sederhana</h1>
    <p>Ini adalah contoh penerapan dasar <span class="highlight">CSS Styling</span> pada struktur HTML.</p>
  </div>
</body>
</html>
